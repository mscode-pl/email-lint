name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli/main.js examples --fail-on never
      - run: node dist/cli/main.js mcp < /dev/null

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks the composite wiring against a release already on npm.
      - id: lint
        uses: ./
        with:
          files: examples
          clients: apple-mail
          comment: 'false'
          version: 0.1.0
      - run: |
          test "${{ steps.lint.outputs.exit-code }}" = "0"
          grep -q "No issues" "${{ steps.lint.outputs.report }}"
