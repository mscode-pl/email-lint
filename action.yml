name: email-lint
description: Find the CSS and HTML in your emails that Outlook, Gmail and Apple Mail break, as PR annotations and a comment.
author: MSCode
branding:
  icon: mail
  color: blue

inputs:
  files:
    description: Files, folders or globs to check, separated by spaces or new lines. Empty uses "files" from email-lint.config.json.
    default: ''
  clients:
    description: Clients to check, comma separated, e.g. gmail,outlook.windows or all. Empty uses the config file, then the defaults.
    default: ''
  ignore:
    description: Feature slugs to skip, comma separated, e.g. css-border-radius.
    default: ''
  strict:
    description: Also report baseline features and Gmail in a mobile browser.
    default: 'false'
  fail-on:
    description: Fail the step on error, warning or never. Empty uses the config file, then error.
    default: ''
  config:
    description: Path to a config file. Empty uses email-lint.config.json when it exists.
    default: ''
  comment:
    description: Post the report as one pull request comment and update it on every push. Needs pull-requests write permission.
    default: 'true'
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}
  version:
    description: email-lint version from npm. Empty uses the version this action was released with.
    default: ''

outputs:
  report:
    description: Path to the Markdown report.
    value: ${{ steps.lint.outputs.report }}
  exit-code:
    description: 0 when the check passed, 1 when it found issues at the fail-on level, 2 for bad input or no matching files.
    value: ${{ steps.lint.outputs.code }}

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

    - if: steps.node.outputs.major < 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - id: lint
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_CLIENTS: ${{ inputs.clients }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set +e -f
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version="$(node -p 'require(process.argv[1]).version' "$GITHUB_ACTION_PATH/package.json")"
        fi
        args=()
        for file in $INPUT_FILES; do args+=("$file"); done
        if [ -n "$INPUT_CLIENTS" ]; then args+=(--clients "$INPUT_CLIENTS"); fi
        if [ -n "$INPUT_IGNORE" ]; then args+=(--ignore "$INPUT_IGNORE"); fi
        if [ "$INPUT_STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$INPUT_FAIL_ON" ]; then args+=(--fail-on "$INPUT_FAIL_ON"); fi
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi

        report="$RUNNER_TEMP/email-lint-report.md"
        npx -y --package="@mscode-pl/email-lint@$version" -- email-lint "${args[@]}" --format github --output "$report"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

    - if: always() && inputs.comment == 'true' && steps.lint.outputs.code != '2' && github.event.pull_request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.lint.outputs.report }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/action/comment.mjs"

    - if: steps.lint.outputs.code != '0'
      shell: bash
      run: |
        echo "email-lint exited with code ${{ steps.lint.outputs.code }}."
        exit ${{ steps.lint.outputs.code }}
